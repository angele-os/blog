# Configuration du blog — lue par Hugo à chaque construction.
# Format TOML : « clé = valeur », et les [crochets] ouvrent une rubrique.

# Adresse publique du site : Hugo s'en sert pour fabriquer les liens absolus
# (lien canonique, flux RSS). Le « / » final est obligatoire.
baseURL = "https://blog.ange-bonkoski.fr/"
title = "Blog d'Ange Bonkoski"

# Le site est uniquement en français.
locale = "fr-FR"
defaultContentLanguage = "fr"

# Par défaut, Hugo met une majuscule aux titres qu'il fabrique lui-même
# (ex. le tag « hugo » devient « Hugo »). On garde les tags tels qu'écrits.
capitalizeListTitles = false

# Génère un robots.txt (fichier lu par les moteurs de recherche).
enableRobotsTXT = true

# Informations réutilisées dans les gabarits via .Site.Params.
[params]
  description = "Journal de mon homelab et write-ups de labs de cybersécurité."
  auteur = "Ange Bonkoski"
  # Lien « Portfolio » du pied de page.
  portfolio = "https://ange-bonkoski.fr/"

# Image d'aperçu par défaut quand on partage un lien du blog (LinkedIn,
# Discord…). Un article peut avoir la sienne : champ « image » du front matter.
[params.partage]
  image = "/img/og-image.png"
  # Texte alternatif : décrit l'image pour qui ne la voit pas.
  alt = "Ange Bonkoski — Réseaux, systèmes et cybersécurité"
  largeur = 1200
  hauteur = 630

# Pages produites pour chaque type de page. On retire le flux RSS de la
# page /tags/ : il listerait des tags, pas des articles. Les flux de
# chaque tag (/tags/hugo/index.xml) restent.
[outputs]
  taxonomy = ["html"]

# Pagination des listes (/journal/, /writeups/, pages de tags) :
# 10 articles par page, les suivantes à /journal/page/2/, etc.
[pagination]
  pagerSize = 10

# Flux RSS : seulement les 20 derniers articles (un flux n'est pas
# une archive, et un fichier plus léger se télécharge plus vite).
[services.rss]
  limit = 20

# Forme des adresses des articles : /journal/nom-de-l-article/
# :slug reprend le champ « slug » du front matter s'il existe, sinon le
# TITRE de l'article (« Exemple de write-up » → exemple-de-write-up).
[permalinks.page]
  journal = "/journal/:slug/"
  writeups = "/writeups/:slug/"

# On garde seulement les tags. Hugo active aussi les « categories » par
# défaut : en les omettant ici, on évite des pages vides inutiles.
[taxonomies]
  tag = "tags"

# Menu de navigation affiché dans l'en-tête. « weight » fixe l'ordre.
[menus]
  [[menus.main]]
    name = "Journal"
    pageRef = "/journal"
    weight = 10
  [[menus.main]]
    name = "Write-ups"
    pageRef = "/writeups"
    weight = 20
  [[menus.main]]
    name = "À propos"
    pageRef = "/a-propos"
    weight = 30

[markup]
  # Coloration du code : avec noClasses = false, Hugo met des classes CSS
  # au lieu de styles en ligne (style="…"), interdits par notre CSP.
  [markup.highlight]
    noClasses = false
  # Sommaire automatique : Hugo liste les titres ## (niveau 2) et ### (niveau 3)
  # de l'article. ordered = false : liste à puces plutôt que numérotée.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  # Refuse le HTML brut écrit dans le Markdown : plus sûr, et empêche
  # d'y glisser par erreur un <script> ou un style en ligne.
  [markup.goldmark.renderer]
    unsafe = false
