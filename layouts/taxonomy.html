{{/*
  Page /tags/ : la liste de tous les tags, avec le nombre d'articles.
*/}}
{{ define "main" }}
<header class="tete">
  {{ $nombre := len .Data.Terms }}
  <p class="surtitre">{{ $nombre }} tag{{ if gt $nombre 1 }}s{{ end }}</p>
  <h1>Tags</h1>
</header>
<ul class="tags tags-tous">
  {{ range .Data.Terms.ByCount }}
  <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }}<span class="nombre">{{ .Count }}</span></a></li>
  {{ end }}
</ul>
{{ end }}
